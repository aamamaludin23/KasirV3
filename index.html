<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KasirPro - Point of Sale</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <style>
      @import url('https://rsms.me/inter/inter.css');
      :root {
        --background-primary: #f9fafb; /* gray-50 */
        --background-secondary: #ffffff; /* white */
        --background-tertiary: #f3f4f6; /* gray-100 */
        --text-primary: #111827; /* gray-900 */
        --text-secondary: #4b5563; /* gray-600 */
        --border-color: #e5e7eb; /* gray-200 */
        --accent-color: #4f46e5; /* indigo-600 */
        --accent-color-hover: #4338ca; /* indigo-700 */
        --accent-text-color: #ffffff;
        --accent-color-light: #eef2ff; /* indigo-50 */
      }
      html.theme-dark {
        --background-primary: #111827; /* gray-900 */
        --background-secondary: #1f2937; /* gray-800 */
        --background-tertiary: #374151; /* gray-700 */
        --text-primary: #f9fafb; /* gray-50 */
        --text-secondary: #9ca3af; /* gray-400 */
        --border-color: #374151; /* gray-700 */
        --accent-color: #818cf8; /* indigo-400 */
        --accent-color-hover: #6366f1; /* indigo-500 */
        --accent-text-color: #1e1b4b; /* indigo-950 */
        --accent-color-light: #3730a3; /* indigo-800 */
      }
      html.theme-blue {
        --background-primary: #f0f9ff; /* sky-50 */
        --background-secondary: #ffffff;
        --background-tertiary: #e0f2fe; /* sky-100 */
        --text-primary: #0c4a6e; /* sky-900 */
        --text-secondary: #0369a1; /* sky-700 */
        --border-color: #bae6fd; /* sky-200 */
        --accent-color: #0ea5e9; /* sky-500 */
        --accent-color-hover: #0284c7; /* sky-600 */
        --accent-text-color: #ffffff;
        --accent-color-light: #e0f2fe; /* sky-100 */
      }
      body {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        background-color: var(--background-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Form Control Styles */
      input[type="text"], input[type="number"], input[type="email"], select, textarea {
        background-color: var(--background-secondary);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 0.5rem; /* 8px */
        padding: 0.75rem 1rem; /* 12px 16px */
        width: 100%;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      input[type="text"]:focus, input[type="number"]:focus, input[type="email"]:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 2px var(--accent-color-light);
      }
      /* Accessibility Improvements */
      *:focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .bg-primary { background-color: var(--background-primary); }
      .bg-secondary { background-color: var(--background-secondary); }
      .bg-tertiary { background-color: var(--background-tertiary); }
      .text-primary { color: var(--text-primary); }
      .text-secondary { color: var(--text-secondary); }
      .border-default { border-color: var(--border-color); }
      .accent-bg { background-color: var(--accent-color); }
      .accent-bg-hover:hover:not(:disabled) { background-color: var(--accent-color-hover); }
      .accent-text { color: var(--accent-text-color); }
      .accent-color { color: var(--accent-color); }
      .accent-bg-light { background-color: var(--accent-color-light); }
      .border-accent { border-color: var(--accent-color); }
      .fade-enter { opacity: 0; transform: scale(0.95); }
      .fade-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms, transform 200ms; }
      .fade-exit { opacity: 1; transform: scale(1); }
      .fade-exit-active { opacity: 0; transform: scale(0.95); transition: opacity 200ms, transform 200ms; }
      .printable-receipt { display: none; }
      .printable-report { display: none; }
      @media print {
        .non-printable { display: none; }
        .printable-receipt { display: block; }
        .printable-report { 
            display: block; 
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
        }
        .report-content {
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: black;
            white-space: pre-wrap;
            padding: 20px;
        }
        body { margin: 0; padding: 0; }
        .receipt-container { width: 80mm; font-size: 12px; color: black; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",

    "idb": "https://cdn.jsdelivr.net/npm/idb@8.0.0/build/index.js",
    "fuse.js": "https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
